<script>

function getXY(o){ var l=0;var t=0; if (o.offsetParent){l=o.offsetLeft;t=o.offsetTop;while(o=o.offsetParent){l+=o.offsetLeft;t+=o.offsetTop;t=t+25;}}return new Array(l,t);} function createXMLHttpRequest(){var ua;if(window.XMLHttpRequest){try{ua=new XMLHttpRequest();}catch(e){ua = false;}} else if(window.ActiveXObject){try {ua = new ActiveXObject("Microsoft.XMLHTTP");}catch(e){ua = false;}} return ua;} var suggestObj,timerSuggest,currentSuggest=0; function keySuggest(obj,e){ if (window.event && e){e = window.event;} if(e){ if(e.keyCode==13||e.keyCode==9){document.getElementById('divSuggest').style.display='none';currentSuggest=0;return true;} if(e.keyCode==38){highlightSuggest(1);return false;} if(e.keyCode==40){highlightSuggest(2);return false;} } suggestObj=obj;setTimeout('loadSuggest()',1); } function loadSuggest(a){ if(!suggestObj.value){document.getElementById('divSuggest').style.display='none';currentSuggest=0;return true;} var v= createXMLHttpRequest(); v.open('get', 'auto_suggest.php?show='+suggestObj.name+'&q='+escape(suggestObj.value)); v.onreadystatechange = function(){if(this.readyState==4){if(this.responseText){processSuggest(this.responseText)}else{document.getElementById('divSuggest').style.display='none';currentSuggest=0;}}}; v.send(null); return true; } function processSuggest(r){clearInterval(timerSuggest); currentSuggest=0; document.getElementById('divSuggest').innerHTML=r; document.getElementById('divSuggest').style.display=''; alignSuggest(); } function alignSuggest(){ if(!suggestObj){return false;} var posXY=getXY(suggestObj); document.getElementById('divSuggest').style.top=posXY[1]+22+'px'; document.getElementById('divSuggest').style.left=posXY[0]+'px'; } function selectSuggest(v){ suggestObj.value=v;document.getElementById('divSuggest').style.display='none';currentSuggest=0;} function hideSuggest(){ timerSuggest=setTimeout("document.getElementById('divSuggest').style.display='none';currentSuggest=0;",20); } function highlightSuggest(v){ if(document.getElementById('divSuggest').style.display=='none'){return false} if(currentSuggest){document.getElementById('l'+currentSuggest).style.background='';} if(v==1){currentSuggest--;} if(v==2){currentSuggest++;} if(!document.getElementById('l'+currentSuggest)){currentSuggest=1;} document.getElementById('l'+currentSuggest).style.background='#f2f2f2'; suggestObj.value=document.getElementById('l'+currentSuggest).getAttribute('q');}

function getOffset(e){var t=0;var n=0;while(e&&!isNaN(e.offsetLeft)&&!isNaN(e.offsetTop)){t+=e.offsetLeft-e.scrollLeft;n+=e.offsetTop-e.scrollTop;e=e.offsetParent}return{top:n,left:t}}function check(e){var t=e&&e.target||event&&event.srcElement;var n=document.getElementById("profile");var r=document.getElementById("userprofile");if(!checkParent(t,"profile")){if(checkParent(t,"userprofile")){if(n.style.display=="none"){n.style.left=getOffset(r).left;n.style.display="";document.getElementById("userprofile").style.color="black"}else{n.style.display="none"}}else{n.style.display="none"}}}function checkParent(e,t){while(e.parentNode){if(e==document.getElementById(t)){return true}e=e.parentNode}return false}document.onclick=check

</script>
