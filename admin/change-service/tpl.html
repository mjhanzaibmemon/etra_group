<!-- @meta -->

<title>Change Service</title>

<!-- @meta -->

<!-- @head_tags -->
<style>
    body {
        background-color: #FFF;
    }

    .change-service {
        padding: 25px 10% 50px;
    }

    .page-title {
        font-style: normal;
        font-weight: 600;
        text-align: center;
        margin-top: 35px;
    }

    table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        border-radius: 2px 2px 0 0;
        overflow: hidden;
        background-color: #FFF;
        margin: 0px auto 20px;
        filter: drop-shadow(0px 0px 7px rgba(0, 0, 0, 0.09));
    }

    table th,
    table td {
        text-align: center;
        padding: 25px 0;
        font-size: 23px;
    }


    table thead {
        color: #FFF;
        height: 60px;
        font-weight: bolder;
        background-color: #000;
    }

    .package {
        color: #000;
        font-size: 19px;
        font-weight: 600;
    }

    input {
        font-size: 11px;
    }

    input {
        background: transparent;
        border: 1px solid #E3E3E3;
        color: #000;
        font-size: 21px;
        font-weight: 600;
        padding: 15px;
    }

    select {
        background: transparent;
        border: 1px solid #000000;
        color: #000;
        font-size: 19px;
        font-weight: 600;
        padding: 10px;
    }

    table tbody tr:nth-child(even) {
        background-color: #F8F9F8;
    }

    .dropdown1 {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        border-radius: 4px;
        border: 1px solid #EEE;
        width: 90px;
        height: 25px;
        margin-left: auto;
        margin-bottom: 15px;
    }

    .dropdown-toggle1 {
        color: #000;
        background-color: transparent;
        font-weight: 600;
        border: none;
        font-size: 15px;
        padding: 0;
    }

    .dropdown-menu1 {
        display: none;
        position: absolute;
        list-style: none;
        padding: 0;
        top: 23px;
        left: 0;
        background-color: #000;
        z-index: 1;
        width: 100%;
        border-radius: 0px 0px 5px 5px;
        white-space: nowrap;
        width: max-content;
        z-index: 9998;
    }

    .btn {
        font-size: 21px;
        padding: 7px 60px;
    }

    .tbl-hide {
        display: none;
    }

    input.error {
        border: solid 1px red;
    }

    .textarea {
        padding: 13px;
        font-size: 14px;
        width: 100%;
        border-radius: 6px;
        border: 1px solid #BEBEBE;
        display: block;
        min-height: 100px;
    }

    .modalBox {
        display: none;
        position: fixed;
        top: 0;
        width: 50%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 9999;
    }

    #japModal1 {
        left: 0;
    }

    #japModal2 {
        right: 0;
    }

    .modalContent {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        position: relative;
    }
</style>

<!-- @head_tags -->

<!-- @script_tags -->
<script src="/admin/common/js/layout.js"></script>
<!-- @script_tags -->
<script src="/common/ckeditor/ckeditor.js"></script>

<script>



    CKEDITOR.on('instanceReady', function (ev) { ev.editor.fire('contentDom'); config.extraAllowedContent = '*(*)'; });



    CKEDITOR.replace('editor1', {

        width: '768px',

        contentsCss: "body {font-size: 15px;font-family:'Poppins';letter-spacing: .4px;}"

    });





    CKEDITOR.addCss('p.imgcaption{background-color:#ccc;padding:5px;font-weight:600;font-size:15px;font-family: arial;}');

    CKEDITOR.extraAllowedContent = '*(*)';



</script>

<main class="change-service">

    <h1 class="page-title">Change Service</h1>

    <div style="text-align: right;margin-bottom:10px;">
        <form method="GET">
            <select name="socialMedia" onchange="form.submit()">
                <option class="option-ig" value="ig">Instagram</option>
                <option class="option-tt" value="tt">Tiktok</option>
            </select>
            <!-- <select name="jap" onchange="form.submit()">
               {japOption}
            </select>             -->
            <select name="category" onchange="form.submit()">
                <option class="category-followers" value="followers">Followers</option>
                <option class="category-likes" value="likes">Likes</option>
                <option class="category-views" value="views">Views</option>
                <option class="category-comments" value="comments">Comments</option>
                <option class="category-freeautolikes" value="freeautolikes">Free Autolikes</option>
                <option class="category-freeautoviews" value="freeautoviews">Free Autoviews</option>
                <option class="category-freelikes" value="freelikes">Free Likes</option>
                <option class="category-freetrial" value="freetrial">Free Followers</option>
                <option class="category-premiumfollowers" value="premiumfollowers">Premium Followers</option>
                <option class="category-premiumlikes" value="premiumlikes">Premium Likes</option>
                <!-- <option class="category-premiumviews" value="premiumviews">Premium Views</option> -->

            </select>
            <input type="button" id="massChangeJap" class="btn btn-primary" value="Change JAPs"></input>
        </form>
    </div>

    <!-- @table -->
    <div id="{tbl_id}" class="{display_tbl}">
        <div style="position: sticky;top:0;background:black;z-index:2;">
            <table style="margin:0;">
                <thead>
                    <tr>
                        <th># ID</th>
                        <th>
                            <div>PACKAGES</div>
                        </th>
                        <th>
                            <div>JAPs</div>
                        </th>
                        <th></th>
                    </tr>
                </thead>
            </table>
        </div>
        <table>
            <tbody>
                <!-- @row -->
                <tr>
                    <td>{id}</td>
                    <td class="package">{name}</td>
                    <td>
                        <a href="{aws_url1}" title="View Screenshot" {target} class="jap-link" data-jap="jap1"
                            data-id="{i}">{japs}</a>
                        &nbsp;&nbsp;&nbsp;
                        <a href="{aws_url2}" title="View Screenshot" {target} class="jap-link" data-jap="jap2"
                            data-id="{i}">{jap2}</a>
                        &nbsp;&nbsp;&nbsp;
                        <a href="{aws_url3}" title="View Screenshot" {target} class="jap-link" data-jap="jap3"
                            data-id="{i}">{jap3}</a>

                        <!-- Hidden inputs to store clicked values for submission -->
                        <input type="hidden" name="jap1_value" id="hidden{i}_jap1" value="{japs}">
                        <input type="hidden" name="jap2_value" id="hidden{i}_jap2" value="{jap2}">
                        <input type="hidden" name="jap3_value" id="hidden{i}_jap3" value="{jap3}">
                    </td>
                    <td style="text-align: right;padding-right:20px;">
                        <form method="POST">
                            <button type="button" id="changeBtnId" class="btn btn-primary" data-id="{i}">Change</button>
                            <input name="jap_name" value="{jap_type}" type="hidden">
                            <input name="jap_value" value="{jap}" type="hidden">
                            <input name="id" value="{id}" type="hidden">
                            <input name="update" value="1" type="hidden">

                        </form>
                    </td>
                </tr>
                <!-- @row -->
            </tbody>
        </table>
    </div>
    <!-- @table -->

    <form action="" method="post">
        <div class="label labelcontact">Notice Message:</div>
        <textarea class="ckeditor input" cols="80" id="editor1" name="noticeMsg" rows="10">{noticeMsgDisplay}</textarea>
        <input type="submit" class="btn btn-primary color3" name="submit" value="Save"
            style="float:left; margin-top: 15px;margin-bottom: 20px;">
        <input type="hidden" name="deleteId" value="{msgId}">
        <input type="submit" onclick="return confirm('Are you sure you want to delete?');"
            class="btn btn-primary color3" name="delete" value="Delete"
            style="float:left; margin-top: 15px;margin-bottom: 20px;margin-left: 10px;">
    </form>

    <br><br><br>
    <!-- Modal -->
    <div id="japModal" class="modalBox" style="left:0;">
        <div style="background:#fff;width:500px;margin:100px auto;padding:20px;border-radius:8px;position:relative;">
            <h2>Update JAP Values</h2>
            <h3 id="modalTitle" style="margin-bottom:20px;"></h3> <!-- new title -->
            <form id="modalForm" method="POST">
                <input type="hidden" name="id" id="modal_id">

                <div style="margin-bottom:15px;">
                    <label>Jap1:</label>
                    <input type="number" name="jap1_value" id="modal_jap1">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Jap2:</label>
                    <input type="number" name="jap2_value" id="modal_jap2">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Jap3:</label>
                    <input type="number" name="jap3_value" id="modal_jap3">
                </div>
                <input name="update" value="1" type="hidden">

                <div style="text-align:right;">
                    <button type="button" style="    padding: 5px;
        width: 35%;
        border-radius: 10px;
        border: none;
        background-color: grey;
        color: white;" class="modalCancel" style="margin-right:10px;">Cancel</button>
                    <button type="submit" id="updateBtn" style="    padding: 5px;
        width: 35%;
        border-radius: 10px;
        border: none;
        background-color: #09b5ff;
        color: white;" name="update">Update</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Second Modal -->
    <div id="japModal2" class="modalBox" style="padding: 1rem;">
        <div class="modalContent" style="overflow: auto;height:90vh;">
            <h2>Service IDs </h2>
            {serviceIds}
            <button type="button" style="    padding: 5px;
        width: 35%;
        border-radius: 10px;
        border: none;
        background-color: grey;
        color: white;" class="modalCancel" style="margin-right:10px;">Cancel</button>
        </div>
    </div>

    <!-- mass modal -->

    <div id="japModal3" class="modalBox" style="left:0;padding: 1rem;">
        <div style="background:#fff;width:90%;padding:20px;border-radius:8px;position:relative;height: 90vh;">
            
             <div style="    display: ruby;">
                <h2>Update Mass JAP</h2>
                    <button type="button" style="    padding: 5px;
        width: 35%;
        border-radius: 10px;
        border: none;
        background-color: grey;
        color: white;" class="modalCancel" style="margin-right:10px;">Cancel</button>
                    <button type="button" id="updateMassBtn" style="    padding: 5px;
        width: 35%;
        border-radius: 10px;
        border: none;
        background-color: #09b5ff;
        color: white;">Update all</button>
                </div>
            <form id="massJapForm" method="POST" style="overflow: auto;height: 70vh;">
                <div class="modalContentBody">
                    <table>
                        <tbody>
                            <tr>
                                <th>OLD JAP</th>
                                <th>PACKAGES</th>
                                <th>NEW JAP</th>
                            </tr>    
                           {massContent}
                           <input type="hidden" value="1" name="massUpdate">
                        </tbody>
                    </table>

                </div>
               
            </form>
        </div>
    </div>

</main>

<script>
    document.querySelectorAll('#changeBtnId').forEach(function (e) {
        e.addEventListener('click', function (e) {
            e.preventDefault();

            var btn = e.target;
            var id = btn.getAttribute('data-id');
            var form = btn.closest('form');
            // var inputType = form.querySelector('input[name=jap_value]');

            var jap1Value = document.querySelector('#hidden' + id + '_jap1').value;
            var jap2Value = document.querySelector('#hidden' + id + '_jap2').value;
            var jap3Value = document.querySelector('#hidden' + id + '_jap3').value;

            form.querySelector('input[name=jap1_value]').value = jap1Value;
            form.querySelector('input[name=jap2_value]').value = jap2Value;
            form.querySelector('input[name=jap3_value]').value = jap3Value;

        });
    });

    document.querySelectorAll('button[type=submit]').forEach(function (e) {
        e.addEventListener('click', function (e) {
            e.preventDefault();

            var btn = e.target;
            var id = btn.getAttribute('data-id');
            var form = btn.closest('form');
            form.submit();
        });
    });


    document.querySelectorAll('button.btn.btn-primary').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.preventDefault();

            // Get row number
            var id = btn.getAttribute('data-id');

            document.getElementById('updateBtn').setAttribute('data-id', id);
            // Get JAP values from hidden inputs
            var jap1 = document.querySelector('#hidden' + id + '_jap1').value;
            var jap2 = document.querySelector('#hidden' + id + '_jap2').value;
            var jap3 = document.querySelector('#hidden' + id + '_jap3').value;

            // Get package name from the table
            var packageName = document.querySelector('#hidden' + id + '_jap1').closest('td').closest('tr').querySelector('.package').textContent;

            // Fill modal inputs
            document.querySelector('#modal_id').value = document.querySelector('#hidden' + id + '_jap1').closest('td').closest('tr').querySelector('td:first-child').textContent;
            document.querySelector('#modal_jap1').value = jap1;
            document.querySelector('#modal_jap2').value = jap2;
            document.querySelector('#modal_jap3').value = jap3;

            // Set modal title
            document.querySelector('#modalTitle').textContent = "Package: " + packageName;

            // Show modal
            document.querySelector('#japModal').style.display = 'block';
            document.querySelector('#japModal2').style.display = 'block';
        });
    });

    // Cancel button
    document.querySelectorAll('.modalCancel').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.modalBox').forEach(function (box) {
                box.style.display = 'none';
            });
        });
    });

    document.getElementById('massChangeJap').addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector('#japModal3').style.display = 'block';
        document.querySelector('#japModal2').style.display = 'block';

    });

    document.querySelector('#japModal3 .modalCancel').addEventListener('click', function () {
        document.querySelector('#japModal3').style.display = 'none';
    });

     document.getElementById('updateMassBtn').addEventListener('click', function (e) {
      
        e.preventDefault();
        document.getElementById('massJapForm').submit();
    });
</script>
