    }

    a{

    }

    h1 {
        text-align: left;

    }

    .label {

    }

    .container div input,
    .selectric,
    .input,

    }

    .btn {

    html {
        overflow-x: hidden;

    .cke_reset_all {

    .articles tr td {

        border: 1px solid #bbb;

        margin-bottom: 15px;
    }

        float: left;
        margin-right: 20px !important;
        width: 176px !important;

    }

    content: '';
    display: block;

</style>

<!-- @head_tags -->


<main>
    <h1 style="text-align:center;margin-top:35px;">Mass Refunds 💳</h1>

    <div class="box23 clearfix">

        <span style="float: right;padding-top: 10px; color: grey">{totalleft}</span>


        <form action="" id="refundForm" method="POST" onsubmit="return prepareFormData()">
            <table class="articles">
                
                {result}
            </table>
        </form>
        
    </div>
</main>


<script>

    function prepareFormData() {
        // Collect all `id`, `orderid`, and `order_session` values
        const ids = [];
        const orderIds = [];
        const orderSessions = [];
        const alorderids = [];
        const alautolikesids = [];
        const percentages = [];

        // Find all the hidden inputs with the relevant names
        // document.querySelectorAll('input[name="id"]').forEach(input => ids.push(input.value));
        document.querySelectorAll('input[name="orderid"]').forEach(input => orderIds.push(input.value));
        document.querySelectorAll('input[name="order_session"]').forEach(input => orderSessions.push(input.value));
        document.querySelectorAll('input[name="alorderid"]').forEach(input => alorderids.push(input.value));
        document.querySelectorAll('input[name="alautolikesid"]').forEach(input => alautolikesids.push(input.value));
        document.querySelectorAll('input[name="percentage"]').forEach(input => percentages.push(input.value));

        // Prepare comma-separated strings
        // const idsString = ids.join(',');
        const orderIdsString = orderIds.join(',');
        const orderSessionsString = orderSessions.join(',');
        const alorderidsString = alorderids.join(',');
        const alautolikesidsString = alautolikesids.join(',');
        const percentagesString = percentages.join(',');

        // Append as hidden inputs to the form
        const form = document.getElementById('refundForm');
        // appendHiddenInput(form, 'ids', idsString);
        appendHiddenInput(form, 'orderids', orderIdsString);
        appendHiddenInput(form, 'order_sessions', orderSessionsString);
        appendHiddenInput(form, 'alorderids', alorderidsString);
        appendHiddenInput(form, 'alautolikesids', alautolikesidsString);
        appendHiddenInput(form, 'percentages', percentagesString);

        // Allow form submission
        return true;
    }

    function appendHiddenInput(form, name, value) {
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
    }
</script>
